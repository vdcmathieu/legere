/* "Le bulletin": ink on paper, one narrow column, one question per screen.
   The tricolore appears exactly twice, decoratively and symmetrically (the ribbon at the top edge and the cockade in the mark).
   Every interactive element, every candidate and every score uses the same ink, so no colour ever maps onto a side. */
:root {
  --paper: #f5f3ee;
  --card: #ffffff;
  --ink: #1b1d22;
  --muted: #5d6168;
  --line: #d8d6cf;
  --soft: #ebe9e2;
  --accent: #1b1d22;
  --accent-ink: #f5f3ee;
  --accent-soft: #e6e4dd;
  --bleu: #1f4f9c;
  --blanc: #ffffff;
  --rouge: #c8102e;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  --tap: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141518; --card: #1d1f24; --ink: #ecebe6; --muted: #a3a6ad; --line: #34373d; --soft: #24262c;
    --accent: #ecebe6; --accent-ink: #141518; --accent-soft: #2d2f36;
    --bleu: #3f6fc4; --blanc: #d9d7d0; --rouge: #d6394a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141518; --card: #1d1f24; --ink: #ecebe6; --muted: #a3a6ad; --line: #34373d; --soft: #24262c;
  --accent: #ecebe6; --accent-ink: #141518; --accent-soft: #2d2f36;
  --bleu: #3f6fc4; --blanc: #d9d7d0; --rouge: #d6394a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--sans); min-height: 100dvh; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.ribbon { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 5px; flex: none; }
.ribbon i:nth-child(1) { background: var(--bleu); }
.ribbon i:nth-child(2) { background: var(--blanc); }
.ribbon i:nth-child(3) { background: var(--rouge); }
.wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 0 16px 48px; flex: 1; display: flex; flex-direction: column; }
.wrap.wide { max-width: 760px; }
main { flex: 1; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 7vw, 38px); }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
p { margin: 0; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-s { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.label { font: 500 14px/1.35 var(--sans); color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* top bars */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 10px 0; }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 600 22px/1 var(--serif); letter-spacing: .005em; background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--ink); }
.cockade { width: 22px; height: 22px; flex: none; }
nav.links { display: flex; gap: 2px; }
nav.links button { background: none; border: 0; padding: 10px 10px; min-height: 44px; color: var(--muted); font: 500 15px var(--sans); cursor: pointer; border-radius: 8px; }
nav.links button[aria-current="page"] { color: var(--ink); }
nav.links button { white-space: nowrap; }
nav.links .short { display: none; }
@media (max-width: 440px) { nav.links .full { display: none; } nav.links .short { display: inline; } }
.qbar { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 0; }
.qbar .progress { flex: 1; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink); flex: none; }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.icon-btn svg { width: 24px; height: 24px; }
.progress { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .35s ease; }
.count { font: 500 14px var(--sans); color: var(--muted); min-width: 2.5ch; text-align: right; }

/* buttons */
.btn { appearance: none; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font: 600 17px var(--sans); min-height: var(--tap); padding: 12px 22px; border-radius: var(--r); cursor: pointer; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.link { background: none; border: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; min-height: 44px; width: auto; padding: 8px 4px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.auto { width: auto; }

/* answer options */
.opts { display: flex; flex-direction: column; gap: 7px; }
.opt { width: 100%; min-height: var(--tap); border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 12px 16px; font: 500 17px/1.3 var(--sans); cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left; transition: border-color .12s, background .12s; }
.opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.opt .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: transparent; }
.opt.on { border-color: var(--ink); background: var(--accent-soft); }
.opt.on .dot { border-color: var(--ink); }
.opt.on .dot::after { background: var(--ink); }
.opt .sub { display: block; font-size: 14.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.opt .key { margin-left: auto; font: 500 12px var(--sans); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.opt.lvl { flex: 1; justify-content: center; min-height: 44px; padding: 8px 6px; font-size: 15px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 10px 16px; min-height: 44px; font: 500 15px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip svg { width: 18px; height: 18px; }
.chip.on { border-color: var(--ink); color: var(--ink); background: var(--accent-soft); }
.under { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* statement */
.q { display: flex; flex-direction: column; gap: 14px; animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.statement { font: 400 clamp(22px, 5.6vw, 28px)/1.3 var(--serif); text-wrap: pretty; }
.term { cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; text-decoration: underline dotted var(--muted); text-decoration-thickness: 2px; text-underline-offset: 4px; border-radius: 3px; }
.plain { background: var(--soft); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 15.5px; line-height: 1.42; }
.plain .label { color: var(--ink); font-weight: 600; font-size: 14px; }
.plain .more { align-self: flex-start; background: none; border: 0; padding: 6px 0; color: var(--ink); font: 500 15px var(--sans); cursor: pointer; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; min-height: 36px; }
.kbd-hint { font-size: 13.5px; color: var(--muted); text-align: center; }
kbd { font: 12px var(--sans); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

/* home */
.hero { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.hero h1 { font-size: clamp(32px, 8.4vw, 46px); line-height: 1.08; }
.hero .intro { font-size: 18px; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.facts li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.facts svg { width: 22px; height: 22px; flex: none; margin-top: 2px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.soft { background: var(--soft); border-color: transparent; }
.note { background: var(--soft); border-left: 3px solid var(--ink); border-radius: 0 var(--r) var(--r) 0; padding: 12px 14px; font-size: 15px; }

/* footer */
.foot { border-top: 1px solid var(--line); margin-top: 40px; padding: 22px 0 8px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--muted); }
.foot nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.foot nav button { background: none; border: 0; padding: 6px 0; min-height: 36px; color: var(--ink); font: 500 14.5px var(--sans); cursor: pointer; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.foot .mark { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font: 600 15px var(--serif); }
.foot .mark .cockade { width: 16px; height: 16px; }

/* sheet (dialog) */
dialog.sheet { border: 0; padding: 0; background: var(--card); color: var(--ink); border-radius: 18px 18px 0 0; width: 100%; max-width: 100%; margin: auto 0 0; max-height: 85vh; max-height: 85dvh; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
dialog.sheet .inner { padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px; overflow: auto; max-height: 85dvh; }
dialog.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
dialog.sheet .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
dialog.sheet h2 { font-size: 22px; padding-top: 6px; }
dialog.sheet .block { display: flex; flex-direction: column; gap: 4px; font-size: 16px; line-height: 1.45; }
dialog.sheet .block .label { color: var(--ink); font-weight: 600; }
@media (min-width: 640px) {
  dialog.sheet { margin: auto; border-radius: 18px; max-width: 560px; }
  dialog.sheet .grip { display: none; }
}

/* dilemmas */
.dilemma { display: flex; flex-direction: column; gap: 10px; }
.dilemma .opt { font: 400 18px/1.4 var(--serif); padding: 16px 18px; align-items: flex-start; }
.dilemma .opt .dot { margin-top: 3px; }
.strength { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.strength .opt { justify-content: center; text-align: center; padding: 10px 6px; font-size: 15px; }

/* priorities */
.prio { display: flex; flex-direction: column; gap: 12px; }
.prio-row { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.prio-row .lvls { display: flex; gap: 6px; }

/* results */
.lead { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.lead .head { display: flex; align-items: center; gap: 16px; }
.lead .who { font: 500 clamp(26px, 6.4vw, 34px)/1.15 var(--serif); }
.lead .party { color: var(--muted); font-size: 15.5px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: var(--soft); border: 1px solid var(--line); filter: grayscale(1); }
.avatar.lg { width: 72px; height: 72px; }
.avatar.xl { width: 112px; height: 112px; }
.ranking { display: flex; flex-direction: column; }
.res-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 64px; grid-template-areas: "rank who pct" "rank ci ci"; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ranking.photos .res-row { grid-template-columns: 26px 40px minmax(0, 1fr) 64px; grid-template-areas: "rank pic who pct" "rank pic ci ci"; }
.res-row .rank { grid-area: rank; font: 500 15px var(--sans); color: var(--muted); text-align: center; }
.res-row .avatar { grid-area: pic; }
.res-row .who { grid-area: who; min-width: 0; }
.res-row .who b { display: block; font: 500 17px/1.25 var(--sans); }
.res-row .who span { font-size: 13.5px; color: var(--muted); }
.res-row .pct { grid-area: pct; font: 600 18px var(--sans); text-align: right; font-variant-numeric: tabular-nums; }
.res-row .ci { grid-area: ci; position: relative; height: 16px; }
.ci .track { position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); }
.ci .band { position: absolute; top: 3px; height: 10px; background: var(--accent-soft); border: 1px solid var(--muted); border-radius: 3px; }
.ci .pt { position: absolute; top: 0; width: 3px; height: 16px; background: var(--ink); border-radius: 2px; }
.res-row.tie .who b::after { content: " · ex æquo"; font-weight: 400; color: var(--muted); font-size: 13.5px; white-space: nowrap; }

function gateImputations(ans) {

function dilemmaAxes() {
  const acc = { econ: [], cult: [], eu: [] };
  for (const d of Q.dilemmas.items) {
    const a = st.dil[d.id]; if (!a || !a.strength || d.axis === "none") continue;
    const towardB = (a.side === "b" ? 1 : -1) * a.strength / 3;
    acc[d.axis].push(towardB * d.b_sign);
  }
  return Object.fromEntries(Object.entries(acc).map(([k, v]) => [k, v.length ? v.reduce((a, b) => a + b, 0) / v.length : null]));
}
function dilemmasDone() { return Q.dilemmas.items.every(d => st.dil[d.id] && st.dil[d.id].strength); }

/* ------------------------------------------------------------------ results */
function axisOf(vec) {
  const acc = { econ: [0, 0], cult: [0, 0], eu: [0, 0] };
  for (const [id, v] of Object.entries(vec)) { const s = SBY[id]; if (!s || s.axis === "none" || v === null || v === undefined) continue; acc[s.axis][0] += s.key * v; acc[s.axis][1] += 2; }
  return Object.fromEntries(Object.entries(acc).map(([k, [a, n]]) => [k, n ? a / n : null]));
}
function userAxes() { return axisOf(Object.fromEntries(Object.entries(effective()).map(([k, e]) => [k, e.v]))); }
function candAxes(c) { return axisOf(Object.fromEntries(Object.entries(c.positions).map(([k, p]) => [k, p.p]))); }
function profileFit(c) {
  const L = st.lead, pr = c.profile || {};
  const parts = [];
  if (L.g1 > 0 && pr.exec_years != null) parts.push([L.g1, Math.min(pr.exec_years / 10, 1), "Expérience"]);
  /* only convictions in the categories the respondent chose count; investigations and acquittals never do */
  const cats = Array.isArray(L.g2) ? L.g2.filter(x => x !== "none") : [];
  if (cats.length && L.g2w > 0 && pr.convictions) {
    const mode = L.g2b || "half";
    const pen = pr.convictions.filter(x => cats.includes(x.cat))
      .map(x => x.status === "convicted_final" ? 1 : mode === "all" ? 1 : mode === "half" ? 0.5 : 0);
    parts.push([L.g2w, 1 - Math.max(0, ...pen), "Condamnations retenues"]);
  }
  if (L.g3 > 0 && pr.reversals != null) parts.push([L.g3, Math.max(0, 1 - pr.reversals / 5), "Constance"]);
  if (L.g4 !== undefined && pr.style != null) parts.push([2, 1 - Math.abs(L.g4 - pr.style) / 4, "Style"]);
  if (L.g5 !== undefined && pr.continuity != null) parts.push([2, 1 - Math.abs(L.g5 - pr.continuity) / 4, "Continuité"]);
  const w = parts.reduce((a, p) => a + p[0], 0);
  return w ? { score: parts.reduce((a, p) => a + p[0] * p[1], 0) / w, parts } : null;
}
function listFr(names) { return names.length <= 1 ? names.join("") : names.slice(0, -1).join(", ") + " et " + names[names.length - 1]; }

    <p class="muted small">Le pourcentage mesure l'accord entre vos réponses et les positions documentées du candidat. La bande claire montre la marge d'incertitude ; quand deux bandes se recouvrent largement, l'ordre entre ces candidats n'est pas certain.</p>
