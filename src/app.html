<style>
/* Layout: one narrow column, like a ballot paper on a table; each question is one bulletin card. Party colours are never used: every candidate shares one neutral ink. */
:root {
  --paper: #eef0ec;
  --card: #fbfcfa;
  --ink: #1b2124;
  --muted: #5a6468;
  --line: #d3d8d4;
  --accent: #1d5c57;
  --accent-ink: #f4faf8;
  --accent-soft: #dbe8e4;
  --warn: #8a5300;
  --warn-soft: #f4e7d3;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111514; --card: #191e1d; --ink: #e5eae7; --muted: #9aa6a2; --line: #2d3533;
    --accent: #72c2b8; --accent-ink: #0d1a18; --accent-soft: #1c3330; --warn: #e2a85a; --warn-soft: #3a2c18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111514; --card: #191e1d; --ink: #e5eae7; --muted: #9aa6a2; --line: #2d3533;
  --accent: #72c2b8; --accent-ink: #0d1a18; --accent-soft: #1c3330; --warn: #e2a85a; --warn-soft: #3a2c18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.brand { font: 600 20px/1 var(--serif); letter-spacing: .01em; }
.brand small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; margin-left: 8px; text-transform: uppercase; }
nav.links { display: flex; gap: 14px; flex-wrap: wrap; }
nav.links button { background: none; border: 0; padding: 0; color: var(--muted); font: 500 13px var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
nav.links button:hover { color: var(--ink); }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.12; }
h2 { font-size: 24px; line-height: 1.2; }
h3 { font-size: 18px; line-height: 1.3; }
p { margin: 0; max-width: 65ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font: 500 14px var(--sans); padding: 10px 18px; border-radius: var(--r); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* bulletin card */
.bulletin { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 22px 22px 20px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 18px; }
.bulletin .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.statement { font: 400 clamp(21px, 4.4vw, 27px)/1.35 var(--serif); text-wrap: pretty; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 10px 4px 8px; font: 500 12.5px/1.25 var(--sans); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 64px; justify-content: flex-start; }
.scale button .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; box-sizing: border-box; }
.scale button .slot { width: 18px; height: 18px; display: grid; place-items: center; flex: none; }
.scale button[data-v="-2"] .dot, .scale button[data-v="2"] .dot { width: 18px; height: 18px; }
.scale button:hover { border-color: var(--ink); }
.scale button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale button.on .dot { background: var(--accent-ink); border-color: var(--accent-ink); }
.under { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 12px; font: 500 12.5px var(--sans); cursor: pointer; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip:hover { color: var(--ink); }
details.ctx { border-top: 1px dashed var(--line); padding-top: 12px; }
details.ctx summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.ctx-grid > div { min-width: 0; font-size: 14px; }
.ctx-today { grid-column: 1 / -1; }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.nav-q { display: flex; justify-content: space-between; gap: 10px; }
textarea { width: 100%; min-height: 120px; resize: vertical; font: 400 16px/1.5 var(--serif); padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); }
select { font: 14px var(--sans); padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); max-width: 100%; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--muted); }

/* dilemmas */
.dilemma { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dilemma button { text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 16px; font: 400 17px/1.4 var(--serif); cursor: pointer; min-width: 0; }
.dilemma button.on { border-color: var(--accent); background: var(--accent-soft); }
.strength { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* importance */
.alloc { display: flex; flex-direction: column; gap: 6px; }
.alloc-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.alloc-row .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.alloc-row .bar i { display: block; height: 100%; background: var(--accent); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 16px var(--mono); cursor: pointer; }
.stepper output { width: 34px; text-align: center; font: 500 15px var(--mono); }
.total { position: sticky; bottom: 0; background: var(--paper); padding: 12px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* results */
.res-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.res-row .who { min-width: 0; }
.res-row .who b { display: block; font: 500 15px/1.2 var(--sans); }
.res-row .who span { font-size: 12px; color: var(--muted); }
.res-row .pct { font: 500 16px var(--mono); text-align: right; }
.ci { position: relative; height: 22px; }
.ci .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
.ci .band { position: absolute; top: 5px; height: 12px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 2px; }
.ci .pt { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--accent); }
.tie { border-left: 3px solid var(--warn); padding-left: 10px; }
.note { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.num { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.heat { display: inline-block; min-width: 38px; text-align: center; border-radius: 3px; padding: 2px 4px; font: 500 12px var(--mono); }
.pos { display: inline-block; min-width: 26px; text-align: center; font: 500 12px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
.src { font-size: 12.5px; color: var(--muted); }
.src a { color: var(--accent); }
.lean { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted); white-space: nowrap; }
svg text { fill: var(--muted); font: 11px var(--sans); }
svg .cand { fill: var(--ink); }
svg .you { fill: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 560px) {
  .scale { grid-template-columns: 1fr; }
  .scale button { flex-direction: row; min-height: 0; padding: 11px 12px; justify-content: flex-start; gap: 12px; text-align: left; }
  .ctx-grid, .grid2, .dilemma { grid-template-columns: 1fr; }
  .res-row { grid-template-columns: minmax(0,1fr) 52px; }
  .res-row .ci { grid-column: 1 / -1; grid-row: 2; }
  .bulletin { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const DATA = /*__DATA__*/null;
</script>
<script>
"use strict";
/* ------------------------------------------------------------------ state */
const S = DATA.statements, SBY = Object.fromEntries(S.map(s => [s.id, s]));
const AREAS = DATA.areas, ABY = Object.fromEntries(AREAS.map(a => [a.id, a]));
const Q = DATA.questionnaire;
const RET = Q.retest.items, RBY = Object.fromEntries(RET.map(r => [r.id, r]));
const CANDS = DATA.candidates;
const CONF = { high: 1, medium: 0.8, low: 0.5, none: 0 };
const PRIOR_K = 2;
const KEY = "legere-2027-v1";
const OPTS = Q.statement_response.options;

let st = load() || fresh();
function fresh() {
  return { screen: "home", seed: Math.floor(Math.random() * 1e9), open: {}, o1area: null,
    ans: {}, imp: {}, hist: [], queue: null, retestShown: [], stopOffered: false,
    dil: {}, dilOrder: null, points: null, lead: {}, expect: null, after: {}, view: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* seeded RNG so a session's order is stable across reloads */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ------------------------------------------------------------------ answers */
function gateImputations(ans) {
  const out = {};
  for (const g of Q.gates.rules) {
    const v = ans[g.if];
    if (v === undefined || v === null) continue;
    const hit = (g.gte !== undefined && v >= g.gte) || (g.lte !== undefined && v <= g.lte);
    /* intensity follows the gate: a mild answer implies a mild opposite, not a strong one */
    if (hit && g.impute) for (const [k, iv] of Object.entries(g.impute)) if (ans[k] === undefined) out[k] = Math.abs(v) === 2 ? iv : iv / 2;
  }
  return out;
}
/* effective respondent vector: answers, merged with reversed retests, plus gate imputations */
function effective() {
  const eff = {};
  for (const [id, v] of Object.entries(st.ans)) {
    if (!SBY[id] || v === null) continue;
    eff[id] = { v, w: st.imp[id] ? 2 : 1 };
  }
  for (const r of RET) {
    const rv = st.ans[r.id];
    if (rv === undefined || rv === null || !eff[r.reverses]) continue;
    eff[r.reverses].v = (eff[r.reverses].v - rv) / 2;
  }
  for (const [id, v] of Object.entries(gateImputations(st.ans))) eff[id] = { v, w: 0.5, imputed: true };
  return eff;
}
function areaWeights() {
  if (!st.points) return Object.fromEntries(AREAS.map(a => [a.id, 1]));
  const eq = 100 / AREAS.length;
  return Object.fromEntries(AREAS.map(a => [a.id, (st.points[a.id] || 0) / eq]));
}

/* ------------------------------------------------------------------ scoring */
function candPos(c, id) { const p = c.positions[id]; return p && p.p !== null && p.p !== undefined ? p : null; }
function scoreAll(eff, opt = {}) {
  const aw = opt.equalAreas ? null : areaWeights();
  const metric = opt.metric || "cityblock";
  return CANDS.map(c => {
    let num = 0, den = 0, sq = 0;
    for (const [id, e] of Object.entries(eff)) {
      const cp = candPos(c, id); if (!cp) continue;
      const w = (aw ? aw[SBY[id].area] : 1) * (opt.noFlags ? Math.min(e.w, 1) : e.w) * (CONF[cp.conf] ?? 0.5);
      if (!w) continue;
      const d = Math.abs(e.v - cp.p);
      num += w * (1 - d / 4); sq += w * d * d; den += w;
    }
    if (metric === "euclid") return den ? ((1 - Math.sqrt(sq / den) / 4) * den + PRIOR_K * 0.5) / (den + PRIOR_K) : 0.5;
    return (num + PRIOR_K * 0.5) / (den + PRIOR_K);
  });
}
/* bootstrap over answered statements + response jitter calibrated by retest consistency */
function bootstrap(eff, B = 1000) {
  const ids = Object.keys(eff);
  const K = CANDS.length, n = ids.length;
  const r = rng(st.seed + n);
  const pj = jitterProb();
  const aw = areaWeights();
  const pre = ids.map(id => CANDS.map(c => { const cp = candPos(c, id); return cp ? [cp.p, (CONF[cp.conf] ?? 0.5)] : null; }));
  const draws = Array.from({ length: K }, () => new Float64Array(B));
  const firsts = new Float64Array(K);
  for (let b = 0; b < B; b++) {
    const num = new Float64Array(K), den = new Float64Array(K);
    for (let t = 0; t < n; t++) {
      const i = Math.floor(r() * n), id = ids[i], e = eff[id];
      let v = e.v;
      if (r() < pj) v = Math.max(-2, Math.min(2, v + (r() < 0.5 ? -1 : 1)));
      const base = aw[SBY[id].area] * e.w;
      for (let k = 0; k < K; k++) { const cp = pre[i][k]; if (!cp) continue; const w = base * cp[1]; num[k] += w * (1 - Math.abs(v - cp[0]) / 4); den[k] += w; }
    }
    let best = -1, bk = 0;
    for (let k = 0; k < K; k++) { const s = (num[k] + PRIOR_K * 0.5) / (den[k] + PRIOR_K); draws[k][b] = s; if (s > best) { best = s; bk = k; } }
    firsts[bk]++;
  }
  return CANDS.map((c, k) => { const d = Array.from(draws[k]).sort((a, b) => a - b); return { lo: d[Math.floor(B * 0.05)], hi: d[Math.floor(B * 0.95)], pFirst: firsts[k] / B, draws: draws[k] }; });
}
function jitterProb() {
  const inc = retestInconsistency();
  return inc === null ? 0.25 : Math.max(0.1, Math.min(0.5, 0.15 + 0.1 * inc));
}
function retestInconsistency() {
  const v = RET.filter(r => st.ans[r.id] !== undefined && st.ans[r.id] !== null && st.ans[r.reverses] !== undefined && st.ans[r.reverses] !== null)
    .map(r => Math.abs(st.ans[r.id] + st.ans[r.reverses]));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function acquiescence() {
  const v = RET.filter(r => st.ans[r.id] != null && st.ans[r.reverses] != null).map(r => st.ans[r.id] + st.ans[r.reverses]);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

/* ------------------------------------------------------------------ adaptive ordering */
function asked() { return new Set(Object.keys(st.ans)); }
function initQueue() {
  const r = rng(st.seed);
  st.queue = shuffle(DATA.core, r);
}
function applyGates(id, v) {
  for (const g of Q.gates.rules) {
    if (g.if !== id || v === null) continue;
    const hit = (g.gte !== undefined && v >= g.gte) || (g.lte !== undefined && v <= g.lte);
    if (!hit) continue;
    const a = asked();
    for (const nx of (g.ask_next || []).slice().reverse()) if (!a.has(nx)) { st.queue = st.queue.filter(x => x !== nx); st.queue.unshift(nx); }
    for (const sk of (g.skip || [])) st.queue = st.queue.filter(x => x !== sk);
  }
}
function remainingStatements() {
  const a = asked(), imp = gateImputations(st.ans);
  return S.filter(s => !a.has(s.id) && imp[s.id] === undefined).map(s => s.id);
}
function nextAdaptive() {
  const rem = remainingStatements(); if (!rem.length) return null;
  const eff = effective(), sc = scoreAll(eff), n = Object.keys(eff).length || 1;
  const se = 0.25 / Math.sqrt(n), mx = Math.max(...sc);
  const post = sc.map(s => Math.exp((s - mx) / se)); const tot = post.reduce((a, b) => a + b, 0);
  let best = -1, bid = rem[0];
  for (const id of rem) {
    let ws = 0, m = 0, cnt = 0;
    const xs = [];
    CANDS.forEach((c, k) => { const cp = candPos(c, id); if (!cp) return; const w = post[k] / tot * (CONF[cp.conf] ?? 0.5); xs.push([cp.p, w]); ws += w; m += w * cp.p; cnt++; });
    if (cnt < 2 || ws === 0) continue;
    m /= ws;
    const v = xs.reduce((a, [x, w]) => a + w * (x - m) ** 2, 0) / ws;
    if (v > best) { best = v; bid = id; }
  }
  return bid;
}
function nextStatement() {
  const a = asked();
  const n = Object.keys(st.ans).filter(id => SBY[id]).length;
  /* insert an unannounced reversed retest every 5 answers once 18 are done */
  if (n >= 18 && n % 5 === 0) {
    const r = RET.find(r => !a.has(r.id) && st.ans[r.reverses] != null && !st.retestShown.includes(n));
    if (r) { st.retestShown.push(n); return r.id; }
  }
  const imp = gateImputations(st.ans);
  while (st.queue.length && (a.has(st.queue[0]) || imp[st.queue[0]] !== undefined)) st.queue.shift();
  if (st.queue.length) return st.queue[0];
  return nextAdaptive();
}
function stability() {
  const eff = effective();
  const bs = bootstrap(eff, 300);
  const top = bs.reduce((b, x, k) => x.pFirst > bs[b].pFirst ? k : b, 0);
  return { pTop: bs[top].pFirst, top };
}
function pendingRetests() { return RET.filter(r => st.ans[r.id] === undefined && st.ans[r.reverses] != null); }

/* ------------------------------------------------------------------ rendering helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => Math.round(x * 100);
function go(screen) { st.screen = screen; save(); render(); window.scrollTo(0, 0); }
function nStatementsAnswered() { return Object.keys(st.ans).filter(id => SBY[id]).length; }
const POS_FR = { "-2": "Contre", "-1": "Plutôt contre", "0": "Partagé", "1": "Plutôt pour", "2": "Pour" };
const TYPE_FR = { programme: "programme", statement: "déclaration", vote: "vote", record_in_office: "action en fonction", party_line: "ligne du parti", inferred: "déduit", none: "aucune" };
const STATUS_FR = { convicted_final: "condamnation définitive", convicted_appeal_pending: "condamnation, recours en cours", indicted: "mise en examen", investigation: "enquête", acquitted: "relaxe ou acquittement", dismissed: "non-lieu ou classement", civil_or_other: "procédure civile ou autre" };
const CONF_FR = { high: "fiabilité élevée", medium: "fiabilité moyenne", low: "fiabilité faible", none: "—" };
function fmtPos(p) { return p === null || p === undefined ? "?" : (p > 0 ? "+" + p : String(p)); }

/* ------------------------------------------------------------------ screens */
const screens = {};

screens.home = () => {
  const started = nStatementsAnswered() > 0;
  return `<div class="stack">
    <span class="label">Questionnaire d'orientation · ${esc(DATA.meta.asof_fr)}</span>
    <h1>Avec quelles idées êtes-vous d'accord, avant de savoir qui les porte&nbsp;?</h1>
    <p>Des propositions concrètes (une trentaine suffisent souvent, 80 au plus), quelques arbitrages et vos priorités. Aucun candidat n'est nommé avant la fin. Le résultat donne votre proximité avec chaque candidat, avec sa marge d'incertitude.</p>
    <div class="grid2">
      <div class="panel"><span class="label">Durée</span><p>15 à 20 minutes. Le questionnaire s'arrête de lui-même quand votre résultat est stable, et vous pouvez continuer pour l'affiner.</p></div>
      <div class="panel"><span class="label">Confidentialité</span><p>Vos réponses restent dans ce navigateur. Rien n'est envoyé ni enregistré ailleurs.</p></div>
    </div>
    <p class="muted">Positions des candidats établies à partir de leurs programmes, déclarations et votes, chacune avec ses sources, consultables dans les fiches. ${CANDS.length} candidats couverts. Données au ${esc(DATA.meta.asof_fr)}.</p>
    <div class="row">
      <button class="btn" id="start" type="button">${started ? "Reprendre" : "Commencer"}</button>
      ${started ? `<button class="btn ghost" id="reset" type="button">Tout recommencer</button>` : ""}
    </div>
    <div id="reset-confirm" hidden class="note">Effacer toutes vos réponses ? <button class="btn ghost" id="reset-yes" type="button">Oui, effacer</button></div>
  </div>`;
};
screens.home.wire = () => {
  $("#start").onclick = () => { if (st.screen === "home") go(resumeScreen()); };
  const r = $("#reset"); if (r) r.onclick = () => { $("#reset-confirm").hidden = false; };
  const y = $("#reset-yes"); if (y) y.onclick = () => { st = fresh(); save(); render(); };
};
function resumeScreen() {
  if (st.view && st.view !== "home") return st.view;
  return "open";
}

/* open questions before */
screens.open = () => {
  const o = Q.open_before;
  return `<div class="stack">
    <span class="label">Avant de commencer · 3 questions ouvertes</span>
    <p class="muted">Écrivez librement. Ces réponses servent à votre réflexion et ne sont pas notées, sauf le thème choisi à la première question, qui vous sera rappelé au moment de pondérer vos priorités.</p>
    ${o.map(q => `<div class="bulletin">
      <label class="statement" for="t-${q.id}" style="font-size:20px">${esc(q.fr)}</label>
      <textarea id="t-${q.id}">${esc(st.open[q.id] || "")}</textarea>
      ${q.followup ? `<div class="row"><label for="o1area" class="muted">${esc(q.followup.fr)}</label>
        <select id="o1area"><option value="">—</option>${AREAS.map(a => `<option value="${a.id}" ${st.o1area === a.id ? "selected" : ""}>${esc(a.fr)}</option>`).join("")}</select></div>` : ""}
    </div>`).join("")}
    <div class="nav-q"><button class="btn ghost" id="back" type="button">Retour</button><button class="btn" id="next" type="button">Passer aux propositions</button></div>
  </div>`;
};
screens.open.wire = () => {
  Q.open_before.forEach(q => { $("#t-" + q.id).oninput = e => { st.open[q.id] = e.target.value; save(); }; });
  $("#o1area").onchange = e => { st.o1area = e.target.value || null; save(); };
  $("#back").onclick = () => go("home");
  $("#next").onclick = () => { if (!st.queue) initQueue(); go("statements"); };
};

/* statements */
screens.statements = () => {
  if (!st.queue) initQueue();
  const id = st.current && !(st.current in st.ans) ? st.current : nextStatement();
  st.current = id; save();
  const nAns = nStatementsAnswered();
  const coreLeft = DATA.core.filter(c => !(c in st.ans) && gateImputations(st.ans)[c] === undefined).length;
  if (!id) return finishStatementsScreen(true);
  if (coreLeft === 0 && !st.stopOffered && nAns >= DATA.core.length + 6 && !RBY[id]) {
    const s = stability();
    if (s.pTop >= 0.9 && !pendingRetests().length) { st.stopOffered = true; save(); return finishStatementsScreen(false, s); }
  }
  const s = SBY[id] || RBY[id];
  const isRet = !!RBY[id];
  const area = isRet ? ABY[SBY[RBY[id].reverses].area] : ABY[s.area];
  const ctx = !isRet && DATA.context[id];
  const v = st.ans[id];
  const total = Math.max(DATA.core.length + 10, nAns + 1);
  return `<div class="stack">
    <div class="progress" aria-hidden="true"><i style="width:${Math.min(100, nAns / total * 100)}%"></i></div>
    <article class="bulletin" aria-live="polite">
      <div class="meta"><span class="label">${esc(area.fr)}</span><span class="label mono">${nAns + 1}${coreLeft ? ` · ${coreLeft} essentielles restantes` : " · affinage"}</span></div>
      <p class="statement">${esc(s.fr)}</p>
      <div class="scale" role="group" aria-label="Votre réponse">
        ${OPTS.filter(o => o.v !== null).map((o, i) => `<button type="button" data-v="${o.v}" class="${v === o.v ? "on" : ""}" aria-pressed="${v === o.v}"><span class="slot"><span class="dot"></span></span>${esc(o.fr)}</button>`).join("")}
      </div>
      <div class="under">
        <button type="button" class="chip ${v === null ? "on" : ""}" id="na">Sans avis</button>
        ${isRet ? "" : `<button type="button" class="chip ${st.imp[id] ? "on" : ""}" id="impt" aria-pressed="${!!st.imp[id]}">${esc(Q.statement_response.important_toggle.fr)}</button>`}
      </div>
      ${ctx ? `<details class="ctx"><summary>En savoir plus sur cette proposition</summary>
        <div class="ctx-grid"><div class="ctx-today"><span class="label">Aujourd'hui</span><p>${esc(ctx.today_fr)}</p></div>
        <div><span class="label">Argument pour</span><p>${esc(ctx.pour_fr)}</p></div><div><span class="label">Argument contre</span><p>${esc(ctx.contre_fr)}</p></div></div></details>` : ""}
    </article>
    <div class="nav-q"><button class="btn ghost" id="back" type="button" ${st.hist.length ? "" : "disabled"}>Précédente</button>
      <span class="muted" style="font-size:12.5px">Clavier : <kbd>1</kbd>–<kbd>5</kbd>, <kbd>0</kbd> sans avis</span></div>
  </div>`;
};
screens.statements.wire = () => {
  const id = st.current; if (!id || !$(".scale")) return bindFinish();
  const answer = v => {
    st.ans[id] = v; st.hist.push(id); st.current = null;
    if (SBY[id]) applyGates(id, v);
    save(); render();
  };
  document.querySelectorAll(".scale button").forEach(b => b.onclick = () => answer(+b.dataset.v));
  $("#na").onclick = () => answer(null);
  const im = $("#impt"); if (im) im.onclick = () => { st.imp[id] = !st.imp[id]; save(); im.classList.toggle("on", st.imp[id]); im.setAttribute("aria-pressed", st.imp[id]); };
  $("#back").onclick = () => { const prev = st.hist.pop(); if (!prev) return; delete st.ans[prev]; st.current = prev; save(); render(); };
  document.onkeydown = e => {
    if (st.screen !== "statements" || e.target.closest("textarea,input,select")) return;
    const m = { "1": -2, "2": -1, "3": 0, "4": 1, "5": 2, "0": null };
    if (e.key in m) { e.preventDefault(); answer(m[e.key]); }
  };
};
function finishStatementsScreen(exhausted, s) {
  const rem = remainingStatements().length;
  return `<div class="stack">
    <span class="label">Propositions · ${nStatementsAnswered()} réponses</span>
    <h2>${exhausted ? "Vous avez répondu à toutes les propositions." : "Votre résultat est déjà stable."}</h2>
    ${exhausted ? "" : `<p>Sur 300 rééchantillonnages de vos réponses, le même candidat arrive en tête dans ${pct(s.pTop)}&nbsp;% des cas. Vous pouvez continuer pour affiner le reste du classement (${rem} propositions restantes) ou passer à la suite.</p>`}
    <div class="row">
      ${exhausted ? "" : `<button class="btn ghost" id="more" type="button">Continuer à répondre</button>`}
      <button class="btn" id="on" type="button">Passer aux arbitrages</button>
    </div>
  </div>`;
}
function bindFinish() {
  const m = $("#more"); if (m) m.onclick = () => { st.stopOffered = true; st.forceAll = true; save(); render(); };
  const o = $("#on"); if (o) o.onclick = () => go("dilemmas");
}

/* dilemmas */
screens.dilemmas = () => {
  const items = Q.dilemmas.items;
  if (!st.dilOrder) { const r = rng(st.seed + 7); st.dilOrder = items.map(() => r() < 0.5); save(); }
  const idx = items.findIndex(d => st.dil[d.id] === undefined || st.dil[d.id].strength === undefined);
  if (idx < 0) { return `<div class="stack"><h2>Arbitrages terminés.</h2><div class="row"><button class="btn" id="on" type="button">Pondérer vos priorités</button></div></div>`; }
  const d = items[idx], flip = st.dilOrder[idx], cur = st.dil[d.id] || {};
  const sides = flip ? [["b", d.b], ["a", d.a]] : [["a", d.a], ["b", d.b]];
  return `<div class="stack">
    <div class="progress"><i style="width:${idx / items.length * 100}%"></i></div>
    <span class="label">Arbitrage ${idx + 1} sur ${items.length}</span>
    <h2>Si vous deviez choisir, vous privilégieriez…</h2>
    <div class="dilemma">${sides.map(([k, t]) => `<button type="button" data-k="${k}" class="${cur.side === k ? "on" : ""}">${esc(t)}</button>`).join("")}</div>
    ${cur.side ? `<div class="stack-s"><span class="label">Avec quelle netteté ?</span><div class="strength">
      ${["Légèrement", "Nettement", "Très nettement"].map((t, i) => `<button type="button" class="chip" data-s="${i + 1}">${t}</button>`).join("")}</div></div>` : ""}
    <div class="nav-q"><button class="btn ghost" id="back" type="button">Précédent</button></div>
  </div>`;
};
screens.dilemmas.wire = () => {
  const o = $("#on"); if (o) { o.onclick = () => go("importance"); return; }
  const items = Q.dilemmas.items;
  const idx = items.findIndex(d => st.dil[d.id] === undefined || st.dil[d.id].strength === undefined);
  const d = items[idx];
  document.querySelectorAll(".dilemma button").forEach(b => b.onclick = () => { st.dil[d.id] = { side: b.dataset.k }; save(); render(); });
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.dil[d.id].strength = +b.dataset.s; save(); render(); });
  $("#back").onclick = () => {
    if (st.dil[d.id]) { delete st.dil[d.id]; }
    else if (idx > 0) { delete st.dil[items[idx - 1].id]; }
    else { go("statements"); return; }
    save(); render();
  };
};
function dilemmaAxes() {
  const acc = { econ: [], cult: [], eu: [] };
  for (const d of Q.dilemmas.items) {
    const a = st.dil[d.id]; if (!a || !a.strength || d.axis === "none") continue;
    const towardB = (a.side === "b" ? 1 : -1) * a.strength / 3;
    acc[d.axis].push(towardB * d.b_sign);
  }
  return Object.fromEntries(Object.entries(acc).map(([k, v]) => [k, v.length ? v.reduce((a, b) => a + b, 0) / v.length : null]));
}

/* importance */
screens.importance = () => {
  if (!st.points) { st.points = Object.fromEntries(AREAS.map(a => [a.id, 0])); }
  const tot = Object.values(st.points).reduce((a, b) => a + b, 0);
  return `<div class="stack">
    <span class="label">Vos priorités</span>
    <h2>Répartissez 100 points entre les thèmes.</h2>
    <p class="muted">Plus un thème reçoit de points, plus il pèse dans le calcul. Un thème à 0 ne compte pas.${st.o1area ? ` Au début, vous avez cité comme problème principal un sujet lié à « ${esc(ABY[st.o1area].fr)} ».` : ""}</p>
    <div class="alloc">${AREAS.map(a => { const v = st.points[a.id] || 0; return `<div class="alloc-row">
      <span>${esc(a.fr)}</span>
      <div class="stepper"><button type="button" data-a="${a.id}" data-d="-5" aria-label="Retirer 5 points à ${esc(a.fr)}">−</button><output>${v}</output><button type="button" data-a="${a.id}" data-d="5" aria-label="Ajouter 5 points à ${esc(a.fr)}">+</button></div>
      <div class="bar"><i style="width:${v}%"></i></div></div>`; }).join("")}</div>
    <div class="total"><span class="mono">${tot} / 100 points</span>
      <div class="row"><button class="btn ghost" id="equal" type="button">Répartir également</button>
      <button class="btn" id="on" type="button" ${tot === 100 ? "" : "disabled"}>Continuer</button></div></div>
  </div>`;
};
screens.importance.wire = () => {
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a, d = +b.dataset.d, tot = Object.values(st.points).reduce((x, y) => x + y, 0);
    const nv = Math.max(0, st.points[a] + d);
    if (d > 0 && tot + d > 100) return;
    st.points[a] = nv; save(); render();
  });
  $("#equal").onclick = () => { const base = Math.floor(100 / AREAS.length); let rest = 100 - base * AREAS.length; AREAS.forEach(a => { st.points[a.id] = base + (rest-- > 0 ? 1 : 0); }); save(); render(); };
  $("#on").onclick = () => go("leadership");
};

/* leadership */
screens.leadership = () => {
  const L = Q.leadership.items;
  const imp = ["Aucune", "Faible", "Moyenne", "Forte", "Décisive"];
  const lik = OPTS.filter(o => o.v !== null);
  const ctl = it => {
    const v = st.lead[it.id];
    if (it.type === "scale5") return `<div class="scale">${imp.map((t, i) => `<button type="button" data-l="${it.id}" data-v="${i}" class="${v === i ? "on" : ""}"><span class="slot"><span class="dot"></span></span>${t}</button>`).join("")}</div>`;
    if (it.type === "likert5") return `<div class="scale">${lik.map(o => `<button type="button" data-l="${it.id}" data-v="${o.v}" class="${v === o.v ? "on" : ""}"><span class="slot"><span class="dot"></span></span>${esc(o.fr)}</button>`).join("")}</div>`;
    if (it.type === "bipolar5") return `<div class="stack-s"><div class="row" style="justify-content:space-between"><span class="muted" style="max-width:45%">${esc(it.left)}</span><span class="muted" style="max-width:45%;text-align:right">${esc(it.right)}</span></div>
      <div class="scale">${[-2, -1, 0, 1, 2].map(x => `<button type="button" data-l="${it.id}" data-v="${x}" class="${v === x ? "on" : ""}" aria-label="${x}"><span class="slot"><span class="dot"></span></span></button>`).join("")}</div></div>`;
    if (it.type === "multi") {
      const sel = Array.isArray(v) ? v : [];
      return `<div class="stack-s">${[...it.options, it.none_option].map(o => `<button type="button" class="chip ${sel.includes(o.v) ? "on" : ""}" style="text-align:left;border-radius:var(--r)" aria-pressed="${sel.includes(o.v)}" data-m="${it.id}" data-s="${o.v}">${esc(o.fr)}</button>`).join("")}</div>`;
    }
    return `<div class="stack-s">${it.options.map(o => `<button type="button" class="chip ${v === o.v ? "on" : ""}" style="text-align:left;border-radius:var(--r)" data-l="${it.id}" data-s="${o.v}">${esc(o.fr)}</button>`).join("")}</div>`;
  };
  /* the weight and appeal questions only matter when some offence category counts */
  const legalOff = Array.isArray(st.lead.g2) && st.lead.g2.includes("none");
  const shown = L.filter(it => !(legalOff && (it.id === "g2w" || it.id === "g2b")));
  const done = shown.every(it => st.lead[it.id] !== undefined && !(Array.isArray(st.lead[it.id]) && !st.lead[it.id].length));
  return `<div class="stack">
    <span class="label">Le profil que vous attendez</span>
    <h2>Au-delà des idées : expérience, probité, constance, style.</h2>
    <p class="muted">Ces réponses produisent un second score, présenté à côté de la proximité d'idées et jamais mélangé sans votre accord.</p>
    ${shown.map(it => `<div class="bulletin"><p class="statement" style="font-size:19px">${esc(it.fr)}</p>${ctl(it)}</div>`).join("")}
    <div class="nav-q"><button class="btn ghost" id="back" type="button">Retour</button><button class="btn" id="on" type="button" ${done ? "" : "disabled"}>Continuer</button></div>
  </div>`;
};
screens.leadership.wire = () => {
  const rerender = () => { save(); const y = window.scrollY; render(); window.scrollTo(0, y); };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { st.lead[b.dataset.l] = b.dataset.s !== undefined ? b.dataset.s : +b.dataset.v; rerender(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const id = b.dataset.m, v = b.dataset.s;
    let sel = Array.isArray(st.lead[id]) ? st.lead[id].slice() : [];
    if (v === "none") sel = sel.includes("none") ? [] : ["none"];
    else { sel = sel.filter(x => x !== "none"); sel = sel.includes(v) ? sel.filter(x => x !== v) : [...sel, v]; }
    st.lead[id] = sel; rerender();
  });
  $("#back").onclick = () => go("importance");
  $("#on").onclick = () => go("expect");
};

/* expectation */
screens.expect = () => `<div class="stack">
  <span class="label">Dernière question avant les résultats</span>
  <h2>${esc(Q.expectation.fr)}</h2>
  <p class="muted">Vos réponses précédentes sont enregistrées : ce choix ne les modifie pas. Il sert seulement à comparer votre intention de départ avec le résultat.</p>
  <div class="stack-s">${[...CANDS.map(c => [c.id, `${c.name} (${c.party})`]), ["undecided", "Je ne savais pas"], ["blank", "Vote blanc ou abstention"]]
    .map(([v, t]) => `<button type="button" class="chip ${st.expect === v ? "on" : ""}" style="text-align:left;border-radius:var(--r)" data-e="${v}">${esc(t)}</button>`).join("")}</div>
  <div class="nav-q"><button class="btn ghost" id="back" type="button">Retour</button><button class="btn" id="on" type="button" ${st.expect ? "" : "disabled"}>Voir mes résultats</button></div>
</div>`;
screens.expect.wire = () => {
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { st.expect = b.dataset.e; save(); render(); });
  $("#back").onclick = () => go("leadership");
  $("#on").onclick = () => go("results");
};

/* ------------------------------------------------------------------ results */
function axisOf(vec) {
  const acc = { econ: [0, 0], cult: [0, 0], eu: [0, 0] };
  for (const [id, v] of Object.entries(vec)) { const s = SBY[id]; if (!s || s.axis === "none" || v === null || v === undefined) continue; acc[s.axis][0] += s.key * v; acc[s.axis][1] += 2; }
  return Object.fromEntries(Object.entries(acc).map(([k, [a, n]]) => [k, n ? a / n : null]));
}
function userAxes() { return axisOf(Object.fromEntries(Object.entries(effective()).map(([k, e]) => [k, e.v]))); }
function candAxes(c) { return axisOf(Object.fromEntries(Object.entries(c.positions).map(([k, p]) => [k, p.p]))); }
function profileFit(c) {
  const L = st.lead, pr = c.profile || {};
  const parts = [];
  if (L.g1 > 0 && pr.exec_years != null) parts.push([L.g1, Math.min(pr.exec_years / 10, 1), "Expérience"]);
  /* only convictions in the categories the respondent chose count; investigations and acquittals never do */
  const cats = Array.isArray(L.g2) ? L.g2.filter(x => x !== "none") : [];
  if (cats.length && L.g2w > 0 && pr.convictions) {
    const mode = L.g2b || "half";
    const pen = pr.convictions.filter(x => cats.includes(x.cat))
      .map(x => x.status === "convicted_final" ? 1 : mode === "all" ? 1 : mode === "half" ? 0.5 : 0);
    parts.push([L.g2w, 1 - Math.max(0, ...pen), "Condamnations"]);
  }
  if (L.g3 > 0 && pr.reversals != null) parts.push([L.g3, Math.max(0, 1 - pr.reversals / 5), "Constance"]);
  if (L.g4 !== undefined && pr.style != null) parts.push([2, 1 - Math.abs(L.g4 - pr.style) / 4, "Style"]);
  if (L.g5 !== undefined && pr.continuity != null) parts.push([2, 1 - Math.abs(L.g5 - pr.continuity) / 4, "Continuité"]);
  const w = parts.reduce((a, p) => a + p[0], 0);
  return w ? { score: parts.reduce((a, p) => a + p[0] * p[1], 0) / w, parts } : null;
}

screens.results = () => {
  const eff = effective();
  const nEff = Object.keys(eff).length;
  if (nEff < 5) return `<div class="stack"><h2>Pas encore assez de réponses.</h2><p>Répondez à au moins quelques propositions pour obtenir un résultat.</p><button class="btn" id="to-q" type="button">Reprendre le questionnaire</button></div>`;
  const sc = scoreAll(eff), bs = bootstrap(eff, 1000);
  const order = CANDS.map((c, k) => k).sort((a, b) => sc[b] - sc[a]);
  const top = order[0];
  /* candidates statistically tied with the top: 90% interval of the difference includes 0 */
  const tied = order.filter(k => { if (k === top) return true; const d = Array.from(bs[top].draws).map((x, i) => x - bs[k].draws[i]).sort((a, b) => a - b); return d[Math.floor(d.length * 0.05)] <= 0; });
  const lo = Math.min(...order.map(k => bs[k].lo)) - 0.02, hi = Math.max(...order.map(k => bs[k].hi)) + 0.02;
  const X = x => ((x - lo) / (hi - lo) * 100).toFixed(2) + "%";
  /* robustness: rank of top under alternative specifications */
  const specs = [["Distance euclidienne", scoreAll(eff, { metric: "euclid" })], ["Thèmes à poids égal", scoreAll(eff, { equalAreas: true })], ["Sans vos « compte beaucoup »", scoreAll(eff, { noFlags: true })]];
  const rob = specs.map(([n, s]) => [n, CANDS.map((c, k) => k).sort((a, b) => s[b] - s[a])[0]]);
  const ua = userAxes(), da = dilemmaAxes();
  const inc = retestInconsistency(), acq = acquiescence();
  const nNA = Object.values(st.ans).filter(v => v === null).length;
  const exp = st.expect;
  const expK = CANDS.findIndex(c => c.id === exp);
  const pf = CANDS.map(profileFit);
  return `<div class="stack">
    <span class="label">Vos résultats · ${nEff} propositions prises en compte</span>
    <h2>Proximité d'idées avec chaque candidat</h2>
    <p class="muted">Le trait marque votre score, la bande son intervalle à 90&nbsp;% (rééchantillonnage de vos réponses et de leur imprécision). Les candidats encadrés en orange ne peuvent pas être départagés de façon fiable.</p>
    <div>${order.map((k, i) => { const c = CANDS[k], b = bs[k]; return `<div class="res-row ${tied.includes(k) && tied.length > 1 ? "tie" : ""}">
      <div class="who"><b>${esc(c.name)}</b><span>${esc(c.party)} · en tête ${pct(b.pFirst)}&nbsp;%</span></div>
      <div class="ci" aria-hidden="true"><div class="track"></div><div class="band" style="left:${X(b.lo)};width:calc(${X(b.hi)} - ${X(b.lo)})"></div><div class="pt" style="left:${X(sc[k])}"></div></div>
      <div class="pct">${pct(sc[k])}&nbsp;%</div></div>`; }).join("")}</div>
    ${tied.length > 1 ? `<div class="note">${tied.map(k => esc(CANDS[k].name)).join(", ")} : avec vos réponses, l'écart entre ${tied.length > 2 ? "ces candidats" : "ces deux candidats"} reste dans la marge d'incertitude. Répondre à davantage de propositions peut les départager.</div>` : ""}
    <div class="panel"><span class="label">Robustesse du premier rang</span>
      <table><tbody>${[["Calcul principal (distance par proposition, vos poids)", top], ...rob].map(([n, k]) => `<tr><td>${esc(n)}</td><td><b>${esc(CANDS[k].name)}</b></td></tr>`).join("")}</tbody></table>
      <p class="muted" style="font-size:13px">${rob.every(r => r[1] === top) ? "Le premier rang ne dépend pas de ces choix de calcul." : "Le premier rang change selon la méthode de calcul : prenez-le comme une égalité."}</p></div>
    ${expK >= 0 || exp === "undecided" ? `<div class="panel"><span class="label">Votre intention de départ</span><p>${expK >= 0 ? `Vous pensiez voter pour <b>${esc(CANDS[expK].name)}</b>, classé ${order.indexOf(expK) + 1}<sup>e</sup> sur ${CANDS.length} pour la proximité d'idées (${pct(sc[expK])}&nbsp;%).` : "Vous étiez indécis."} ${expK >= 0 && expK !== top ? "Plus bas, les propositions où vous divergez de ce candidat montrent ce qui fait la différence." : ""}</p></div>` : ""}
    <div class="panel"><span class="label">Carte des positions</span>${mapSVG(ua, da)}
      <p class="muted" style="font-size:13px">Point plein : vous, d'après les propositions. Cercle : vous, d'après les arbitrages. ${axisAgreement(ua, da)}</p></div>
    <div class="panel"><span class="label">Accord par thème avec les ${Math.min(4, CANDS.length)} premiers</span>${areaTable(eff, order.slice(0, 4))}</div>
    <div class="panel"><span class="label">Là où vous divergez de ${esc(CANDS[top].name)}</span>${disagreements(eff, top)}</div>
    ${expK >= 0 && expK !== top ? `<div class="panel"><span class="label">Là où vous divergez de ${esc(CANDS[expK].name)}, votre intention de départ</span>${disagreements(eff, expK)}</div>` : ""}
    <div class="panel"><span class="label">Profil attendu (score séparé)</span>${profileTable(pf, order)}</div>
    ${st.lead.g6 && st.lead.g6 !== "sincere" ? `<div class="panel"><span class="label">Dynamique électorale</span>${viability(order)}</div>` : ""}
    <div class="panel"><span class="label">Qualité de vos réponses</span>
      <table><tbody>
      <tr><td>Réponses « sans avis »</td><td class="num">${nNA}</td></tr>
      <tr><td>Cohérence aux questions reformulées (0 = parfaite, 4 = opposée)</td><td class="num">${inc === null ? "—" : inc.toFixed(1)}</td></tr>
      <tr><td>Tendance à acquiescer (0 = aucune)</td><td class="num">${acq === null ? "—" : (acq > 0 ? "+" : "") + acq.toFixed(1)}</td></tr>
      </tbody></table>
      ${inc !== null && inc >= 1.5 ? `<p class="note">Vos réponses à des propositions reformulées en sens inverse se contredisent en partie. L'incertitude affichée a été élargie en conséquence.</p>` : ""}</div>
    <div class="panel"><span class="label">Pour aller plus loin</span>
      ${Q.open_after.map(q => `<label for="t-${q.id}">${esc(q.fr)}</label><textarea id="t-${q.id}">${esc(st.after[q.id] || "")}</textarea>`).join("")}
      ${st.open.o3 ? `<p class="muted">Au début, vous avez écrit ce qui vous empêcherait de voter pour quelqu'un : « ${esc(st.open.o3)} ». Vérifiez ce point dans les fiches des candidats en tête.</p>` : ""}
    </div>
    <div class="row"><button class="btn ghost" id="to-q" type="button">Modifier mes réponses</button><button class="btn ghost" id="cands" type="button">Fiches candidats</button><button class="btn ghost" id="copy" type="button">Copier mes réponses</button></div>
    <p id="copied" class="muted" hidden>Réponses copiées dans le presse-papiers.</p>
    <textarea id="copy-fallback" hidden readonly></textarea>
  </div>`;
};
screens.results.wire = () => {
  $("#to-q").onclick = () => { st.stopOffered = true; go("statements"); };
  const c = $("#cands"); if (c) c.onclick = () => go("cands");
  Q.open_after.forEach(q => { const t = $("#t-" + q.id); if (t) t.oninput = e => { st.after[q.id] = e.target.value; save(); }; });
  const cp = $("#copy"); if (cp) cp.onclick = () => {
    const txt = JSON.stringify({ answers: st.ans, important: st.imp, open: st.open, after: st.after, dilemmas: st.dil, points: st.points, leadership: st.lead, expectation: st.expect, data_asof: DATA.meta.asof }, null, 1);
    navigator.clipboard.writeText(txt).then(() => { $("#copied").hidden = false; }).catch(() => { const f = $("#copy-fallback"); f.hidden = false; f.value = txt; f.select(); });
  };
};
function axisAgreement(ua, da) {
  const pairs = ["econ", "cult", "eu"].filter(k => ua[k] !== null && da[k] !== null).map(k => [k, Math.abs(ua[k] - da[k])]);
  const bad = pairs.filter(p => p[1] > 0.5);
  if (!pairs.length) return "";
  const nm = { econ: "économique", cult: "culturel", eu: "européen" };
  return bad.length ? `Sur l'axe ${bad.map(b => nm[b[0]]).join(" et ")}, vos arbitrages et vos réponses détaillées ne vous placent pas au même endroit : vos principes généraux et vos choix concrets divergent, ce qui est fréquent et mérite réflexion.` : "Vos arbitrages et vos réponses détaillées vous placent au même endroit.";
}
/* drawing width follows the screen so labels keep their real size on phones */
function plotWidth() { const el = $("#app"); return Math.max(300, Math.min(520, (el ? el.clientWidth : 520) - 40)); }
function mapSVG(ua, da) {
  const W = plotWidth(), H = Math.round(W * 0.82), P = 46;
  /* domain padded beyond [-1, 1] so points on the extremes keep room for their labels */
  const D = 1.18, sx = x => P + (x + D) / (2 * D) * (W - 2 * P), sy = y => H - P - (y + D) / (2 * D) * (H - 2 * P);
  const pts = CANDS.map(c => ({ c, a: candAxes(c) })).filter(o => o.a.econ !== null && o.a.cult !== null);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Carte économique et culturelle">
    <rect x="${P}" y="${P}" width="${W - 2 * P}" height="${H - 2 * P}" fill="none" stroke="var(--line)"/>
    <line x1="${W / 2}" y1="${P}" x2="${W / 2}" y2="${H - P}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${P}" y1="${H / 2}" x2="${W - P}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${P}" y="${H - P + 18}">← redistribution</text><text x="${W - P}" y="${H - P + 18}" text-anchor="end">marché →</text>
    <text x="${P - 8}" y="${P - 10}">↑ autorité, tradition</text><text x="${P - 8}" y="${H - 12}">↓ libéralisme culturel</text>
    ${placeLabels(pts.map(o => ({ x: sx(o.a.econ), y: sy(o.a.cult), t: o.c.short || o.c.name })), W).map(l => `<circle cx="${l.x}" cy="${l.y}" r="4" class="cand"/>${l.lead ? `<line x1="${l.x}" y1="${l.y}" x2="${l.lx + (l.anchor === "end" ? 2 : -2)}" y2="${l.ly - 4}" stroke-width="0.8" stroke="var(--line)"/>` : ""}<text x="${l.lx}" y="${l.ly}" text-anchor="${l.anchor}" style="fill:var(--ink)">${esc(l.t)}</text>`).join("")}
    ${ua.econ !== null && ua.cult !== null ? `<circle cx="${sx(ua.econ)}" cy="${sy(ua.cult)}" r="7" class="you"/>` : ""}
    ${da.econ !== null && da.cult !== null ? `<circle cx="${sx(da.econ)}" cy="${sy(da.cult)}" r="7" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ""}
  </svg></div>
  ${ua.eu !== null ? `<div class="stack-s"><span class="label">Axe européen</span>${euStrip(ua.eu, da.eu)}</div>` : ""}`;
}
/* place each label right of its point, else left, nudging down until it no longer overlaps an earlier one */
function placeLabels(pts, W) {
  const cw = 6.2, lh = 13;
  const placed = pts.map(p => ({ x0: p.x - 5, x1: p.x + 5, y0: p.y - 5, y1: p.y + 5 }));
  const hit = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;
  return pts.sort((a, b) => a.y - b.y || a.x - b.x).map(p => {
    const w = p.t.length * cw;
    for (const k of [0, -1, 1, -2, 2, 3, -3, 4]) {
      for (const side of [1, -1]) {
        const lx = side > 0 ? p.x + 7 : p.x - 7, ly = p.y + 4 + k * lh;
        const box = side > 0 ? { x0: lx, x1: lx + w, y0: ly - 10, y1: ly + 2 } : { x0: lx - w, x1: lx, y0: ly - 10, y1: ly + 2 };
        if (box.x1 > W - 2 || box.x0 < 2) continue;
        if (!placed.some(b => hit(b, box))) { placed.push(box); return { ...p, lx, ly, anchor: side > 0 ? "start" : "end", lead: k !== 0 }; }
      }
    }
    return { ...p, lx: p.x + 7, ly: p.y + 4, anchor: "start", lead: false };
  });
}
function euStrip(u, d) {
  const W = plotWidth(), P = 46, sx = x => P + (x + 1) / 2 * (W - 2 * P);
  const pts = CANDS.map(c => ({ c, v: candAxes(c).eu })).filter(o => o.v !== null).sort((a, b) => a.v - b.v);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${60 + pts.length * 0}" width="100%" style="max-width:${W}px" role="img" aria-label="Axe européen">
    <line x1="${P}" y1="30" x2="${W - P}" y2="30" stroke="var(--line)"/>
    <text x="${P}" y="54">${W < 440 ? "← intégration" : "← intégration européenne"}</text><text x="${W - P}" y="54" text-anchor="end">${W < 440 ? "souveraineté →" : "souveraineté nationale →"}</text>
    ${pts.map((o, i) => `<line x1="${sx(o.v)}" y1="22" x2="${sx(o.v)}" y2="38" stroke="var(--ink)" stroke-width="1.5"><title>${esc(o.c.name)}</title></line>`).join("")}
    <circle cx="${sx(u)}" cy="30" r="6" class="you"/>
    ${d !== null && d !== undefined ? `<circle cx="${sx(d)}" cy="30" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ""}
  </svg></div>
  <p class="muted" style="font-size:12.5px">De l'intégration à la souveraineté : ${pts.map(o => esc(o.c.short || o.c.name)).join(" · ")}</p>`;
}
function areaTable(eff, ks) {
  const rows = AREAS.map(a => {
    const ids = Object.keys(eff).filter(id => SBY[id].area === a.id);
    if (!ids.length) return null;
    const cells = ks.map(k => { let n = 0, s = 0; ids.forEach(id => { const cp = candPos(CANDS[k], id); if (!cp) return; n++; s += 1 - Math.abs(eff[id].v - cp.p) / 4; }); return n ? s / n : null; });
    return `<tr><td>${esc(a.fr)}</td>${cells.map(v => v === null ? `<td class="num">—</td>` : `<td class="num"><span class="heat" style="background:color-mix(in srgb, var(--accent) ${Math.round(v * v * 70)}%, transparent);color:${v > 0.75 ? "var(--accent-ink)" : "var(--ink)"}">${pct(v)}</span></td>`).join("")}</tr>`;
  }).filter(Boolean);
  return `<div class="tablewrap"><table><thead><tr><th>Thème</th>${ks.map(k => `<th class="num">${esc(CANDS[k].short || CANDS[k].name)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function disagreements(eff, k) {
  const c = CANDS[k];
  const rows = Object.entries(eff).map(([id, e]) => { const cp = candPos(c, id); return cp ? { id, e, cp, gap: Math.abs(e.v - cp.p) } : null; })
    .filter(r => r && r.gap >= 2).sort((a, b) => b.gap - a.gap).slice(0, 8);
  if (!rows.length) return `<p>Aucun désaccord marqué sur les propositions auxquelles vous avez répondu.</p>`;
  return rows.map(r => `<div class="stack-s" style="border-bottom:1px solid var(--line);padding-bottom:10px">
    <p style="font-family:var(--serif);font-size:16px">${esc(SBY[r.id].fr)}</p>
    <p class="muted" style="font-size:13px">Vous : <span class="pos">${fmtPos(Math.round(r.e.v))}</span> · ${esc(c.name)} : <span class="pos">${fmtPos(r.cp.p)}</span> (${esc(TYPE_FR[r.cp.type] || r.cp.type)}, ${esc(CONF_FR[r.cp.conf] || "")}). ${esc(r.cp.summary || "")}</p>
    ${srcList(r.cp.sources)}</div>`).join("");
}
function srcList(src) {
  if (!src || !src.length) return "";
  return `<p class="src">${src.slice(0, 3).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.outlet || "source")}</a> <span class="lean">${esc(s.lean || "")}</span>`).join(" · ")}</p>`;
}
function profileTable(pf, order) {
  if (pf.every(p => !p)) return `<p class="muted">Vous n'avez accordé d'importance à aucun critère de profil.</p>`;
  const catFr = { probity: "probité", speech: "délit de parole", other: "autre délit" };
  const legalTxt = pr => !pr.convictions ? "—" : !pr.convictions.length ? "aucune condamnation" :
    pr.convictions.map(x => `${catFr[x.cat]}${x.status === "convicted_final" ? "" : " (recours en cours)"}`).filter((x, i, a) => a.indexOf(x) === i).join(", ");
  return `<div class="tablewrap"><table><thead><tr><th>Candidat</th><th class="num">Profil</th><th>Exécutif</th><th>Justice</th></tr></thead><tbody>
    ${order.map(k => { const c = CANDS[k], p = pf[k], pr = c.profile || {}; return `<tr><td>${esc(c.name)}</td><td class="num">${p ? pct(p.score) + "&nbsp;%" : "—"}</td><td class="num">${pr.exec_years != null ? pr.exec_years + " ans" : "—"}</td><td>${esc(legalTxt(pr))}</td></tr>`; }).join("")}
  </tbody></table></div><p class="muted" style="font-size:13px">Détail et sources dans les fiches candidats. Le style et la continuité reposent sur une estimation documentée mais discutable : voir la méthode.</p>`;
}
function viability(order) {
  const P = DATA.meta.polls || {};
  return `<p class="muted" style="font-size:13px">${esc(P.source || "")}. Un sondage n'est pas une prévision, surtout à six mois du scrutin.</p>
  <table><tbody>${order.map(k => { const c = CANDS[k], p = (P.values || {})[c.id]; return `<tr><td>${esc(c.name)}</td><td class="num">${p ? p[0] + "–" + p[1] + "&nbsp;%" : "non disponible"}</td></tr>`; }).join("")}</tbody></table>`;
}

/* ------------------------------------------------------------------ candidate fiches */
screens.cands = () => {
  const sel = st.candSel || CANDS[0].id;
  const c = CANDS.find(x => x.id === sel) || CANDS[0];
  const rec = c.record || {};
  return `<div class="stack">
    <span class="label">Fiches candidats · positions codées et sources</span>
    <div class="row"><label for="csel" class="muted">Candidat</label><select id="csel">${CANDS.map(x => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.name)} (${esc(x.party)})</option>`).join("")}</select></div>
    <h2>${esc(c.name)}</h2>
    ${rec.bio ? `<p>${esc(rec.bio)}</p>` : ""}
    <div class="grid2">
      <div class="panel"><span class="label">Parcours</span>${(rec.offices || []).slice(0, 10).map(o => `<p style="font-size:13.5px">${esc(o.office)} <span class="muted mono">${esc(String(o.from || "").slice(0, 4))}–${esc(/^\d{4}/.test(o.to || "") ? o.to.slice(0, 4) : (o.to || ""))}</span></p>`).join("") || "<p class='muted'>—</p>"}</div>
      <div class="panel"><span class="label">Affaires judiciaires</span>${(rec.legal || []).map(l => `<p style="font-size:13.5px">${esc(l.case)} <span class="lean">${esc(STATUS_FR[l.status] || l.status)}</span> <span class="muted mono">${esc(l.date)}</span></p>`).join("") || "<p style='font-size:13.5px'>Aucune affaire personnelle recensée.</p>"}</div>
    </div>
    ${(rec.reversals || []).length ? `<div class="panel"><span class="label">Changements de position documentés</span>${rec.reversals.map(r => `<p style="font-size:13.5px"><b>${esc(r.topic)}</b> (${esc(r.years)}) : ${esc(r.before)} → ${esc(r.after)}</p>`).join("")}</div>` : ""}
    ${rec.media_portrayal ? `<div class="panel"><span class="label">Comment la presse le présente</span>
      <p style="font-size:13.5px"><b>Presse de gauche :</b> ${esc(rec.media_portrayal.left_media)}</p>
      <p style="font-size:13.5px"><b>Presse de droite :</b> ${esc(rec.media_portrayal.right_media)}</p>
      <p style="font-size:13.5px"><b>Médias neutres :</b> ${esc(rec.media_portrayal.neutral_media)}</p></div>` : ""}
    <div class="panel"><span class="label">Positions sur les ${S.length} propositions</span>
      ${AREAS.map(a => `<h3 style="margin-top:6px">${esc(a.fr)}</h3>${S.filter(s => s.area === a.id).map(s => { const p = c.positions[s.id]; return `<div class="stack-s" style="border-bottom:1px solid var(--line);padding-bottom:8px">
        <p style="font-size:14px"><span class="pos">${fmtPos(p && p.p)}</span> ${esc(s.fr)}</p>
        ${p && p.p !== null ? `<p class="muted" style="font-size:12.5px">${esc(TYPE_FR[p.type] || p.type)} · ${esc(CONF_FR[p.conf] || "")}. ${esc(p.summary || "")}${p.nuance ? " " + esc(p.nuance) : ""}</p>${srcList(p.sources)}` : `<p class="muted" style="font-size:12.5px">Pas de position documentée.</p>`}
      </div>`; }).join("")}`).join("")}
    </div>
  </div>`;
};
screens.cands.wire = () => { $("#csel").onchange = e => { st.candSel = e.target.value; save(); render(); }; };

/* ------------------------------------------------------------------ method */
screens.method = () => `<div class="stack">${DATA.method_html}</div>`;

/* ------------------------------------------------------------------ router */
function render() {
  const fn = screens[st.screen] || screens.home;
  document.onkeydown = null;
  $("#app").innerHTML = fn();
  (fn.wire || (() => {}))();
  if (!["cands", "method", "home"].includes(st.screen)) { st.view = st.screen; save(); }
}
$("#nav-home").onclick = () => go(st.view && st.view !== "home" ? st.view : "home");
$("#nav-cands").onclick = () => go("cands");
$("#nav-method").onclick = () => go("method");
render();
</script>
